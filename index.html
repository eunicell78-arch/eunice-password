<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🔑 비밀번호 보관함</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="보관함">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f3ef;--surface:#fff;--surface2:#f0efe9;--border:#e2e0d8;--text:#1a1a18;--muted:#7a7972;--hint:#b0afa6;--accent:#2d6a4f;--accent-bg:#e8f4ee;--accent-light:#c8e6d4;--danger:#c0392b;--danger-bg:#fdecea;--bank:#1a4fa0;--bank-bg:#e8f0fc;--r:14px;--rs:8px}
@media(prefers-color-scheme:dark){:root{--bg:#181816;--surface:#222220;--surface2:#2a2a27;--border:#38382e;--text:#f0efe8;--muted:#88877e;--hint:#55554c;--accent:#52b788;--accent-bg:#1a2e22;--accent-light:#1e3d2a;--danger:#e57373;--danger-bg:#2e1a1a;--bank:#5b8dd9;--bank-bg:#1a2440}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;width:100%}

/* ── PIN ── */
#pinScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:16px;width:100%;overflow:hidden}
.pin-icon{font-size:36px;margin-bottom:10px}
.pin-title{font-size:18px;font-weight:700;margin-bottom:4px}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:20px;text-align:center;line-height:1.5;white-space:pre-line}
.pin-dots{display:flex;gap:12px;margin-bottom:20px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);transition:all .15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.pin-err{font-size:12px;color:var(--danger);margin-bottom:12px;min-height:16px;text-align:center}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;margin:0 auto}
.num-btn{width:72px;height:72px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:20px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:transform .1s,background .1s}
.num-btn:active{background:var(--surface2);transform:scale(.93)}
.num-btn.del{font-size:16px;color:var(--muted)}
.num-btn.empty{border:none;background:transparent;cursor:default}
.num-btn:disabled{opacity:.4;cursor:not-allowed}
.pin-forget{margin-top:16px;font-size:12px;color:var(--hint);text-decoration:underline;cursor:pointer;background:none;border:none}

/* ── APP ── */
#appScreen{display:none}
.screen{display:none;max-width:480px;margin:0 auto;padding-bottom:80px}
.screen.active{display:block}
.topbar{display:flex;align-items:center;padding:20px 16px 14px;gap:8px}
.topbar h1{font-size:20px;font-weight:700;flex:1;letter-spacing:-.4px}
.topbar-btns{display:flex;gap:6px;flex-shrink:0}
.btn-icon{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn-icon:active{background:var(--surface2)}
.btn-back{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0}

/* ── GROUP SCREEN ── */
.group-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.group-card:active{background:var(--surface2)}
.g-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.g-info{flex:1}
.g-name{font-size:15px;font-weight:600}
.g-count{font-size:12px;color:var(--muted);margin-top:2px}
.g-arrow{font-size:16px;color:var(--hint)}
.g-edit{font-size:13px;color:var(--hint);background:none;border:none;cursor:pointer;padding:4px 8px;flex-shrink:0}
.group-add-btn{margin:10px 16px 0;padding:13px;border:1.5px dashed var(--border);border-radius:var(--r);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;width:calc(100% - 32px);text-align:center}
.group-add-btn:active{background:var(--surface2)}

/* ── ITEM SCREEN ── */
.search-wrap{position:relative;margin:0 16px 12px}
.search-wrap input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border);border-radius:var(--r);font-size:15px;background:var(--surface);color:var(--text);-webkit-appearance:none}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.sico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.count-lbl{font-size:12px;color:var(--hint);margin:0 16px 10px;display:block}
.item-list{padding:0 16px;display:flex;flex-direction:column;gap:10px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card-hd{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.card-ico.pw{background:var(--accent-bg);color:var(--accent)}
.card-ico.bank{background:var(--bank-bg);color:var(--bank)}
.card-title{font-size:14px;font-weight:600;flex:1}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;flex-shrink:0}
.badge.bank{background:var(--bank-bg);color:var(--bank)}
.card-edit-btn{font-size:12px;color:var(--hint);background:none;border:none;cursor:pointer;padding:4px 6px}
.field-row{display:flex;align-items:center;padding:10px 14px;gap:8px}
.field-row+.field-row{border-top:1px solid var(--border)}
.flbl{font-size:11px;color:var(--hint);width:60px;flex-shrink:0;letter-spacing:.3px}
.fval{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faction{display:flex;gap:5px;flex-shrink:0}
.btn-a{padding:5px 10px;font-size:12px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--muted);cursor:pointer;white-space:nowrap}
.btn-a:active{background:var(--border)}
.btn-a.ok{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}

.empty{text-align:center;padding:48px 16px;color:var(--hint)}
.empty .eico{font-size:36px;margin-bottom:10px}
.empty p{font-size:14px;margin-bottom:16px}
.empty-btn{padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer}

/* ── FAB ── */
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:50}
.fab:active{opacity:.88}

/* ── MODALS ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;padding:24px 20px 44px;max-height:93vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
.mfield{margin-bottom:13px}
.mfield label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.mfield input,.mfield select,.mfield textarea{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);-webkit-appearance:none;font-family:inherit}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.modal-btns button{flex:1;padding:13px;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer}
.btn-cancel{border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn-save{border:none;background:var(--accent);color:#fff}
.btn-del{border:1px solid var(--danger)!important;background:var(--danger-bg)!important;color:var(--danger)!important;flex:0 0 auto!important;padding:13px 14px!important}

/* type tabs */
.type-tabs{display:flex;gap:8px;margin-bottom:14px}
.type-tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:var(--rs);background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:center}
.type-tab.on.pw{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.type-tab.on.bank{border-color:var(--bank);background:var(--bank-bg);color:var(--bank)}

/* menu */
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-btn{width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.menu-btn:active{background:var(--border)}
.menu-btn.red{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.divider{height:1px;background:var(--border);margin:4px 0}
.sec-lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* pin change modal */
.pin-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.pin-modal-bg.open{display:flex}
.pin-modal{background:var(--surface);border-radius:var(--r);padding:24px;width:100%;max-width:320px}
.pin-modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.pm-f{margin-bottom:12px}
.pm-f label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.pm-f input{width:100%;padding:10px 12px;font-size:20px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);letter-spacing:6px;text-align:center;-webkit-appearance:none}
.pm-f input:focus{outline:none;border-color:var(--accent)}
.pm-err{font-size:12px;color:var(--danger);margin-top:8px;min-height:16px}
.pm-btns{display:flex;gap:8px;margin-top:16px}
.pm-btns button{flex:1;padding:11px;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer}

/* group color */
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.color-dot.sel{border-color:var(--text);transform:scale(1.2)}

.tip{background:var(--surface2);border-radius:var(--rs);padding:12px 14px;font-size:12px;color:var(--muted);margin:14px 16px 0;line-height:1.6}
</style>
</head>
<body>

<!-- PIN -->
<div id="pinScreen">
  <div class="pin-icon" id="pinIcon">🔒</div>
  <div class="pin-title" id="pinTitle">잠금 해제</div>
  <div class="pin-sub" id="pinSub">PIN 4자리를 입력해 주세요</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-err" id="pinErr"></div>
  <div class="numpad">
    <button class="num-btn" onclick="np('1')">1</button><button class="num-btn" onclick="np('2')">2</button><button class="num-btn" onclick="np('3')">3</button>
    <button class="num-btn" onclick="np('4')">4</button><button class="num-btn" onclick="np('5')">5</button><button class="num-btn" onclick="np('6')">6</button>
    <button class="num-btn" onclick="np('7')">7</button><button class="num-btn" onclick="np('8')">8</button><button class="num-btn" onclick="np('9')">9</button>
    <button class="num-btn empty"></button><button class="num-btn" onclick="np('0')">0</button><button class="num-btn del" onclick="nd()">⌫</button>
  </div>
  <button class="pin-forget" id="pinForget" onclick="forgetPin()" style="display:none">PIN을 잊었어요</button>
</div>

<!-- APP -->
<div id="appScreen">

  <!-- 그룹 화면 -->
  <div class="screen active" id="groupScreen">
    <div class="topbar">
      <h1>🔑 보관함</h1>
      <div class="topbar-btns">
        <button class="btn-icon" onclick="openMenu()">⋯ 메뉴</button>
        <button class="btn-icon" onclick="lockApp()">🔒</button>
      </div>
    </div>
    <div class="group-list" id="groupList"></div>
    <button class="group-add-btn" onclick="openGroupModal()">＋ 그룹 추가</button>
    <div class="tip">💡 그룹을 탭해서 항목을 확인하고, 오른쪽 ✏️를 눌러 그룹 이름을 수정할 수 있어요</div>
  </div>

  <!-- 항목 화면 -->
  <div class="screen" id="itemScreen">
    <div class="topbar">
      <button class="btn-back" onclick="goBack()">‹</button>
      <h1 id="itemTitle">전체</h1>
      <div class="topbar-btns"></div>
    </div>
    <div class="search-wrap">
      <span class="sico">🔍</span>
      <input type="search" id="searchInput" placeholder="검색..." oninput="renderItems()" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <span id="countLabel" class="count-lbl"></span>
    <div class="item-list" id="itemList"></div>
  </div>

  <button class="fab" id="fabBtn" onclick="openAdd()">＋ 새 항목 추가</button>
</div>

<!-- ── 항목 추가/수정 모달 ── -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">새 항목 추가</h3>
    <div class="type-tabs">
      <button class="type-tab pw on" id="tabPw" onclick="setType('pw')">🔑 사이트 / 앱</button>
      <button class="type-tab bank" id="tabBank" onclick="setType('bank')">🏦 은행 / 금융</button>
    </div>
    <div class="mfield"><label id="fNameLbl">사이트 이름 *</label><input type="text" id="fName" placeholder="예: 네이버" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <!-- 사이트/앱 필드 -->
    <div id="pwFields">
      <div class="mfield"><label>아이디 / 이메일</label><input type="text" id="fId" placeholder="예: hong@email.com" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none"></div>
      <div class="mfield"><label>비밀번호</label><input type="text" id="fPw" placeholder="비밀번호" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    </div>
    <!-- 은행/금융 필드 -->
    <div id="bankFields" style="display:none">
      <div class="mfield"><label>계좌번호</label><input type="text" id="fAcct" placeholder="예: 110-1234-5678" autocomplete="off" inputmode="numeric"></div>
      <div class="mfield"><label>계좌 비밀번호</label><input type="password" id="fAcctPw" placeholder="계좌 비밀번호 (4자리)" autocomplete="off" inputmode="numeric"></div>
      <div class="mfield"><label>인터넷뱅킹 아이디</label><input type="text" id="fBankId" placeholder="(선택)" autocomplete="off" autocapitalize="none"></div>
      <div class="mfield"><label>인터넷뱅킹 비밀번호</label><input type="text" id="fBankPw" placeholder="(선택)" autocomplete="off"></div>
    </div>
    <div class="mfield">
      <label>그룹</label>
      <select id="fGroup"></select>
    </div>
    <div class="mfield"><label>메모 (선택)</label><input type="text" id="fNote" placeholder="추가 정보" autocomplete="off"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEdit()">취소</button>
      <button class="btn-del" id="delBtn" onclick="deleteItem()" style="display:none">삭제</button>
      <button class="btn-save" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- ── 그룹 추가/수정 모달 ── -->
<div class="modal-bg" id="groupModal">
  <div class="modal">
    <h3 id="groupModalTitle">그룹 추가</h3>
    <div class="mfield"><label>그룹 이름</label><input type="text" id="gName" placeholder="예: 쇼핑, SNS, 회사" autocomplete="off"></div>
    <div class="mfield">
      <label>아이콘</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px" id="iconPicker">
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="📁">📁</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🛍">🛍</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="💼">💼</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🏦">🏦</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🎮">🎮</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="✈️">✈️</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="💬">💬</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🏠">🏠</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="⭐">⭐</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🔒">🔒</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="💡">💡</span>
        <span style="font-size:24px;cursor:pointer;padding:4px" onclick="pickIcon(this)" data-v="🎵">🎵</span>
      </div>
      <input type="hidden" id="gIcon" value="📁">
    </div>
    <div class="mfield">
      <label>색상</label>
      <div class="color-row" id="colorPicker"></div>
      <input type="hidden" id="gColor" value="#2d6a4f">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeGroupModal()">취소</button>
      <button class="btn-del" id="gDelBtn" onclick="deleteGroup()" style="display:none">삭제</button>
      <button class="btn-save" onclick="saveGroup()">저장</button>
    </div>
  </div>
</div>

<!-- ── 메뉴 모달 ── -->
<div class="modal-bg" id="menuModal">
  <div class="modal">
    <h3>메뉴</h3>
    <div class="menu-list">
      <div class="sec-lbl">가져오기</div>
      <button class="menu-btn" onclick="document.getElementById('xlsxFile').click()">📊 엑셀 파일 가져오기</button>
      <input type="file" id="xlsxFile" accept=".xlsx,.xls,*/*" style="display:none" onchange="startXlsxImport(event)">
      <button class="menu-btn" onclick="closeMenu();openMemoImport()">📝 메모장 텍스트 가져오기</button>
      <div class="divider"></div>
      <div class="sec-lbl">백업 / 복원</div>
      <button class="menu-btn" onclick="exportJSON()">📤 백업 (JSON 내보내기)</button>
      <button class="menu-btn" onclick="document.getElementById('importFile').click()">📥 복원 (JSON 가져오기)</button>
      <button class="menu-btn" onclick="exportCSV()">📋 CSV 내보내기</button>
      <input type="file" id="importFile" accept=".json,*/*" style="display:none" onchange="importJSON(event)">
      <div class="divider"></div>
      <button class="menu-btn" onclick="closeMenu();openPinChange()">🔑 PIN 변경</button>
      <button class="menu-btn red" onclick="clearAll()">🗑 모든 데이터 삭제</button>
      <button class="btn-cancel" style="width:100%;padding:13px;border-radius:var(--rs);font-size:15px;cursor:pointer;border:1px solid var(--border);background:transparent;margin-top:4px" onclick="closeMenu()">닫기</button>
    </div>
  </div>
</div>

<!-- ── 엑셀 열 매핑 ── -->
<div class="modal-bg" id="xlsxModal">
  <div class="modal">
    <h3>📊 엑셀 열 설정</h3>
    <div id="xlsxAutoMsg" style="background:var(--accent-bg);border-radius:var(--rs);padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--accent);line-height:1.6"></div>
    <div class="mfield"><label>사이트/은행 이름 열 *</label><select id="xSite"></select></div>

    <div class="mfield"><label>메모 열 (선택)</label><select id="xNote"></select></div>
    <div class="mfield">
      <label style="font-weight:600;color:var(--text)">📁 그룹 열 ← 여기서 그룹 열 선택!</label>

    </div>

      <button class="btn-save" onclick="confirmXlsx()">가져오기</button>

</div>

<!-- ── 메모장 가져오기 ── -->
<div class="modal-bg" id="memoModal">
  <div class="modal">
    <h3>📝 메모장 가져오기</h3>

      3가지 형식 모두 인식해요<br>
      <b>형식1:</b> 네이버 아이디 / 비번<br>

<!-- ── PIN 변경 ── -->
<div class="pin-modal-bg" id="pinChangeModal">
  <div class="pin-modal">
    <h3>🔑 PIN 변경</h3>
    <div class="pm-f"><label>현재 PIN</label><input type="password" id="curPin" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="pm-f"><label>새 PIN (4자리)</label><input type="password" id="newPin" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="pm-f"><label>새 PIN 확인</label><input type="password" id="newPin2" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="pm-err" id="pmErr"></div>
    <div class="pm-btns">
      <button style="border:1px solid var(--border);background:transparent;color:var(--muted)" onclick="closePinChange()">취소</button>
      <button style="border:none;background:var(--accent);color:#fff;font-weight:600" onclick="changePinSubmit()">변경</button>
    </div>
  </div>
</div>

<script>
const LOCK_KEY='pv2_pin', DATA_KEY='pv2_data', GRP_KEY='pv2_grp';
let pinInput='',pinStep='verify',pinFirst='',wrongCount=0;
let items=[], groups=[], editIdx=-1, editGrpIdx=-1, curGroup=null, selIcon='📁', lockTimer;
let xlsxRawRows=[], xlsxHeaders=[];

const GROUP_COLORS=['#2d6a4f','#1a4fa0','#c0392b','#8e44ad','#d35400','#16a085','#c0392b','#7f8c8d','#2c3e50','#e67e22'];

// ── SHA256 ──
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function getPin(){try{return localStorage.getItem(LOCK_KEY);}catch(e){return null;}}
async function savePin(p){try{localStorage.setItem(LOCK_KEY,await sha256(p));}catch(e){}}
function loadData(){
  try{
    // 기존 버전(pv_data) 데이터 자동 마이그레이션
    const oldData=localStorage.getItem('pv_data');
    if(oldData && !localStorage.getItem(DATA_KEY)){
      const oldItems=JSON.parse(oldData);
      // 기존 데이터를 새 형식으로 변환
      const migrated=oldItems.map(it=>({
        type:'pw',
        name:it.site||it.name||'',
        id:it.id||'',
        pw:it.pw||'',
        acct:'',acctPw:'',bankId:'',bankPw:'',
        group:'',
        note:it.note||'',
        updated:it.updated||Date.now()
      }));
      localStorage.setItem(DATA_KEY,JSON.stringify(migrated));
      localStorage.removeItem('pv_data');
    }
    items=JSON.parse(localStorage.getItem(DATA_KEY)||'[]');
    groups=JSON.parse(localStorage.getItem(GRP_KEY)||'[]');
  }catch(e){items=[];groups=[];}
}
function saveData(){try{localStorage.setItem(DATA_KEY,JSON.stringify(items));localStorage.setItem(GRP_KEY,JSON.stringify(groups));}catch(e){}}

// ── PIN ──
function initPin(){
  const stored=getPin();
  if(!stored){pinStep='set1';document.getElementById('pinIcon').textContent='🔐';document.getElementById('pinTitle').textContent='PIN 설정';document.getElementById('pinSub').textContent='처음 사용하시네요!\n4자리 PIN을 설정해 주세요';document.getElementById('pinForget').style.display='none';}
  else{pinStep='verify';document.getElementById('pinIcon').textContent='🔒';document.getElementById('pinTitle').textContent='잠금 해제';document.getElementById('pinSub').textContent='PIN 4자리를 입력해 주세요';document.getElementById('pinForget').style.display='block';}
  pinInput='';dots();
}
function np(n){if(pinInput.length>=4)return;pinInput+=n;dots();if(pinInput.length===4)setTimeout(processPin,120);}
function nd(){if(!pinInput.length)return;pinInput=pinInput.slice(0,-1);dots();document.getElementById('pinErr').textContent='';}
function dots(state){for(let i=0;i<4;i++){const d=document.getElementById('d'+i);d.className='pin-dot'+(i<pinInput.length?' filled':'')+(state?' '+state:'');}}
async function processPin(){
  if(pinStep==='set1'){pinFirst=pinInput;pinInput='';document.getElementById('pinTitle').textContent='PIN 확인';document.getElementById('pinSub').textContent='한 번 더 입력해 주세요';dots();pinStep='set2';}
  else if(pinStep==='set2'){
    if(pinInput===pinFirst){await savePin(pinInput);unlock();}
    else{dots('error');setTimeout(()=>{document.getElementById('pinErr').textContent='PIN이 일치하지 않아요. 다시 설정해 주세요';pinFirst='';pinInput='';pinStep='set1';document.getElementById('pinTitle').textContent='PIN 설정';document.getElementById('pinSub').textContent='4자리 PIN을 설정해 주세요';dots();},500);}
  } else {
    const h=await sha256(pinInput);
    if(h===getPin()){wrongCount=0;unlock();}
    else{
      wrongCount++;dots('error');
      document.getElementById('pinErr').textContent=wrongCount>=5?'PIN 5회 오류 — 10초 대기':`PIN이 틀렸어요 (${wrongCount}/5)`;
      if(wrongCount>=5){document.querySelectorAll('.num-btn').forEach(b=>b.disabled=true);let s=10;const t=setInterval(()=>{s--;if(s<=0){clearInterval(t);document.querySelectorAll('.num-btn').forEach(b=>b.disabled=false);document.getElementById('pinErr').textContent='';wrongCount=0;}},1000);}
      setTimeout(()=>{pinInput='';dots();},600);
    }
  }
}
function unlock(){document.getElementById('pinScreen').style.display='none';document.getElementById('appScreen').style.display='block';loadData();renderGroups();resetTimer();}
function lockApp(){
  document.getElementById('appScreen').style.display='none';document.getElementById('pinScreen').style.display='flex';
  closeAll();pinInput='';pinStep='verify';wrongCount=0;
  document.getElementById('pinIcon').textContent='🔒';document.getElementById('pinTitle').textContent='잠금 해제';document.getElementById('pinSub').textContent='PIN 4자리를 입력해 주세요';document.getElementById('pinErr').textContent='';document.getElementById('pinForget').style.display='block';dots();
}
function forgetPin(){
  if(!confirm('PIN을 초기화하면 저장된 데이터도 모두 지워져요.\n계속할까요?'))return;
  [LOCK_KEY,DATA_KEY,GRP_KEY].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  items=[];groups=[];pinFirst='';pinInput='';pinStep='set1';wrongCount=0;
  document.getElementById('pinIcon').textContent='🔐';document.getElementById('pinTitle').textContent='PIN 설정';document.getElementById('pinSub').textContent='새 PIN을 설정해 주세요';document.getElementById('pinErr').textContent='';document.getElementById('pinForget').style.display='none';dots();
}
function closeAll(){['editModal','menuModal','xlsxModal','memoModal','groupModal'].forEach(id=>document.getElementById(id).classList.remove('open'));}
function resetTimer(){clearTimeout(lockTimer);lockTimer=setTimeout(lockApp,3*60*1000);}
['touchstart','click','keydown'].forEach(e=>document.addEventListener(e,()=>{if(document.getElementById('appScreen').style.display!=='none')resetTimer();},{passive:true}));

// ── SCREENS ──
function goBack(){
  document.getElementById('itemScreen').classList.remove('active');
  document.getElementById('groupScreen').classList.add('active');
  document.getElementById('searchInput').value='';
  curGroup=null;
}
function openGroupScreen(gid){
  curGroup=gid;
  const gName=gid==='all'?'전체 항목':gid===null?'그룹 없음':(groups.find(g=>g.id===gid)||{name:'?'}).name;
  document.getElementById('itemTitle').textContent=gName;
  document.getElementById('groupScreen').classList.remove('active');
  document.getElementById('itemScreen').classList.add('active');
  document.getElementById('searchInput').value='';
  renderItems();
}

// ── GROUP RENDER ──
function renderGroups(){
  const C=document.getElementById('groupList');
  const allCount=items.length;
  let html=`<div class="group-card" onclick="openGroupScreen('all')">
    <div class="g-icon" style="background:var(--surface2)">🗂</div>
    <div class="g-info"><div class="g-name">전체 항목</div><div class="g-count">${allCount}개</div></div>
    <div class="g-arrow">›</div>
  </div>`;
  groups.forEach((g,i)=>{
    const cnt=items.filter(it=>it.group===g.id).length;
    html+=`<div class="group-card">
      <div class="g-icon" style="background:${g.color}22;font-size:18px;display:flex;align-items:center;justify-content:center" onclick="openGroupScreen('${g.id}')">${g.icon}</div>
      <div class="g-info" onclick="openGroupScreen('${g.id}')"><div class="g-name">${esc(g.name)}</div><div class="g-count">${cnt}개</div></div>
      <button class="g-edit" onclick="openGroupEdit(${i})">✏️</button>
      <div class="g-arrow" onclick="openGroupScreen('${g.id}')">›</div>
    </div>`;
  });
  // 그룹 없는 항목
  const noGrpCnt=items.filter(it=>!it.group||!groups.find(g=>g.id===it.group)).length;
  if(noGrpCnt>0){
    html+=`<div class="group-card" onclick="openGroupScreen(null)">
      <div class="g-icon" style="background:var(--surface2)">📂</div>
      <div class="g-info"><div class="g-name">미분류</div><div class="g-count">${noGrpCnt}개</div></div>
      <div class="g-arrow">›</div>
    </div>`;
  }
  C.innerHTML=html;
}

// ── ITEM RENDER ──
function renderItems(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  let list;
  if(curGroup==='all') list=items;
  else if(curGroup===null) list=items.filter(it=>!it.group||!groups.find(g=>g.id===it.group));
  else list=items.filter(it=>it.group===curGroup);
  if(q) list=list.filter(it=>(it.name||it.site||'').toLowerCase().includes(q)||(it.id||'').toLowerCase().includes(q));
  const total=curGroup==='all'?items.length:curGroup===null?items.filter(it=>!it.group||!groups.find(g=>g.id===it.group)).length:items.filter(it=>it.group===curGroup).length;
  document.getElementById('countLabel').textContent=q?`"${q}" 결과 ${list.length}개`:`${total}개`;
  const C=document.getElementById('itemList');
  if(!list.length){
    C.innerHTML=`<div class="empty"><div class="eico">${q?'🔎':'🗝'}</div><p>${q?'검색 결과가 없어요':'항목이 없어요'}</p>${!q?`<button class="empty-btn" onclick="openAdd()">추가하기</button>`:''}</div>`;
    return;
  }
  C.innerHTML=list.map(it=>{
    const ri=items.indexOf(it);
    const isBank=it.type==='bank';
    const ico=isBank?'🏦':(it.name||'?').charAt(0).toUpperCase();
    return `<div class="card">
      <div class="card-hd">
        <div class="card-ico ${isBank?'bank':'pw'}">${ico}</div>
        <span class="card-title">${esc(it.name||it.site||'')}</span>
        ${isBank?`<span class="badge bank">은행</span>`:''}
        <button class="card-edit-btn" onclick="openEdit(${ri})">✏️ 수정</button>
      </div>
      ${isBank?bankRows(it,ri):pwRows(it,ri)}
      ${it.note?`<div class="field-row"><span class="flbl">메모</span><span class="fval" style="color:var(--muted);font-weight:400">${esc(it.note)}</span></div>`:''}
    </div>`;
  }).join('');
}

function pwRows(it,ri){
  return `
    <div class="field-row"><span class="flbl">아이디</span><span class="fval">${esc(it.id)||'<span style="color:var(--hint)">없음</span>'}</span><div class="faction"><button class="btn-a" onclick="cp('${ea(it.id)}',this)">복사</button></div></div>
    <div class="field-row"><span class="flbl">비밀번호</span><span class="fval" id="pv${ri}">••••••••</span><div class="faction"><button class="btn-a" id="pb${ri}" onclick="tp('${ea(it.pw)}',${ri})">보기</button><button class="btn-a" onclick="cp('${ea(it.pw)}',this)">복사</button></div></div>`;
}
function bankRows(it,ri){
  return `
    ${it.acct?`<div class="field-row"><span class="flbl">계좌번호</span><span class="fval">${esc(it.acct)}</span><div class="faction"><button class="btn-a" onclick="cp('${ea(it.acct)}',this)">복사</button></div></div>`:''}
    ${it.acctPw?`<div class="field-row"><span class="flbl">계좌 비번</span><span class="fval" id="pv${ri}">••••</span><div class="faction"><button class="btn-a" id="pb${ri}" onclick="tp('${ea(it.acctPw)}',${ri})">보기</button><button class="btn-a" onclick="cp('${ea(it.acctPw)}',this)">복사</button></div></div>`:''}
    ${it.bankId?`<div class="field-row"><span class="flbl">뱅킹 ID</span><span class="fval">${esc(it.bankId)}</span><div class="faction"><button class="btn-a" onclick="cp('${ea(it.bankId)}',this)">복사</button></div></div>`:''}
    ${it.bankPw?`<div class="field-row"><span class="flbl">뱅킹 PW</span><span class="fval" id="bpv${ri}">••••••••</span><div class="faction"><button class="btn-a" id="bpb${ri}" onclick="tp2('${ea(it.bankPw)}',${ri})">보기</button><button class="btn-a" onclick="cp('${ea(it.bankPw)}',this)">복사</button></div></div>`:''}`;
}

// ── ADD / EDIT ──
let curType='pw';
function setType(t){
  curType=t;
  document.getElementById('tabPw').className='type-tab pw'+(t==='pw'?' on':'');
  document.getElementById('tabBank').className='type-tab bank'+(t==='bank'?' on':'');
  document.getElementById('pwFields').style.display=t==='pw'?'block':'none';
  document.getElementById('bankFields').style.display=t==='bank'?'block':'none';
  document.getElementById('fNameLbl').textContent=t==='bank'?'은행 이름 *':'사이트 이름 *';
  document.getElementById('fName').placeholder=t==='bank'?'예: 국민은행':'예: 네이버';
}

function fillGroupSelect(selId, includeNone=true){
  const sel=document.getElementById(selId);
  let html=includeNone?'<option value="">미분류</option>':'<option value="">— 없음 —</option>';
  html+=groups.map(g=>`<option value="${g.id}">${g.icon} ${esc(g.name)}</option>`).join('');
  sel.innerHTML=html;
}

function openAdd(){
  editIdx=-1;curType='pw';
  document.getElementById('modalTitle').textContent='새 항목 추가';
  setType('pw');
  ['fName','fId','fPw','fAcct','fBankId','fBankPw','fNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fAcctPw').value='';
  fillGroupSelect('fGroup');
  if(curGroup&&curGroup!=='all'&&curGroup!==null) document.getElementById('fGroup').value=curGroup;
  document.getElementById('delBtn').style.display='none';
  document.getElementById('editModal').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),120);
}

function openEdit(i){
  editIdx=i;const it=items[i];curType=it.type||'pw';
  document.getElementById('modalTitle').textContent='항목 수정';
  setType(curType);
  document.getElementById('fName').value=it.name||it.site||'';
  document.getElementById('fId').value=it.id||'';
  document.getElementById('fPw').value=it.pw||'';
  document.getElementById('fAcct').value=it.acct||'';
  document.getElementById('fAcctPw').value=it.acctPw||'';
  document.getElementById('fBankId').value=it.bankId||'';
  document.getElementById('fBankPw').value=it.bankPw||'';
  document.getElementById('fNote').value=it.note||'';
  fillGroupSelect('fGroup');
  document.getElementById('fGroup').value=it.group||'';
  document.getElementById('delBtn').style.display='block';
  document.getElementById('editModal').classList.add('open');
}

function closeEdit(){document.getElementById('editModal').classList.remove('open');}

function saveItem(){
  const name=document.getElementById('fName').value.trim();
  if(!name){alert('이름을 입력해 주세요');return;}
  const entry={
    type:curType, name,
    id:document.getElementById('fId').value.trim(),
    pw:document.getElementById('fPw').value.trim(),
    acct:document.getElementById('fAcct').value.trim(),
    acctPw:document.getElementById('fAcctPw').value.trim(),
    bankId:document.getElementById('fBankId').value.trim(),
    bankPw:document.getElementById('fBankPw').value.trim(),
    group:document.getElementById('fGroup').value||'',
    note:document.getElementById('fNote').value.trim(),
    updated:Date.now()
  };
  if(editIdx>=0){items[editIdx]=entry;}else{items.unshift(entry);}
  saveData();closeEdit();
  if(document.getElementById('itemScreen').classList.contains('active')) renderItems();
  renderGroups();
}

function deleteItem(){
  if(!confirm(`"${items[editIdx].name||items[editIdx].site}" 항목을 삭제할까요?`))return;
  items.splice(editIdx,1);saveData();closeEdit();renderItems();renderGroups();
}

// ── GROUP MODAL ──
function initColorPicker(){
  const C=document.getElementById('colorPicker');
  C.innerHTML=GROUP_COLORS.map(c=>`<div class="color-dot" style="background:${c}" onclick="pickColor(this,'${c}')" data-c="${c}"></div>`).join('');
}
function pickColor(el,c){
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('gColor').value=c;
}
function pickIcon(el){
  document.querySelectorAll('#iconPicker span').forEach(s=>s.style.background='transparent');
  el.style.background='var(--surface2)';
  document.getElementById('gIcon').value=el.dataset.v;
}

function openGroupModal(){
  editGrpIdx=-1;
  document.getElementById('groupModalTitle').textContent='그룹 추가';
  document.getElementById('gName').value='';
  document.getElementById('gIcon').value='📁';
  document.getElementById('gColor').value=GROUP_COLORS[0];
  document.getElementById('gDelBtn').style.display='none';
  initColorPicker();
  document.querySelectorAll('#iconPicker span').forEach(s=>s.style.background='transparent');
  document.querySelector('#iconPicker span').style.background='var(--surface2)';
  document.querySelector('.color-dot').classList.add('sel');
  document.getElementById('groupModal').classList.add('open');
  setTimeout(()=>document.getElementById('gName').focus(),120);
}
function openGroupEdit(i){
  editGrpIdx=i;const g=groups[i];
  document.getElementById('groupModalTitle').textContent='그룹 수정';
  document.getElementById('gName').value=g.name;
  document.getElementById('gIcon').value=g.icon;
  document.getElementById('gColor').value=g.color;
  document.getElementById('gDelBtn').style.display='block';
  initColorPicker();
  document.querySelectorAll('#iconPicker span').forEach(s=>{s.style.background=s.dataset.v===g.icon?'var(--surface2)':'transparent';});
  document.querySelectorAll('.color-dot').forEach(d=>{if(d.dataset.c===g.color)d.classList.add('sel');else d.classList.remove('sel');});
  document.getElementById('groupModal').classList.add('open');
}
function closeGroupModal(){document.getElementById('groupModal').classList.remove('open');}
function saveGroup(){
  const name=document.getElementById('gName').value.trim();
  if(!name){alert('그룹 이름을 입력해 주세요');return;}
  const g={id:editGrpIdx>=0?groups[editGrpIdx].id:'g'+Date.now(),name,icon:document.getElementById('gIcon').value,color:document.getElementById('gColor').value};
  if(editGrpIdx>=0){groups[editGrpIdx]=g;}else{groups.push(g);}
  saveData();closeGroupModal();renderGroups();
}
function deleteGroup(){
  const g=groups[editGrpIdx];
  if(!confirm(`"${g.name}" 그룹을 삭제할까요?\n항목들은 미분류로 이동해요.`))return;
  items.forEach(it=>{if(it.group===g.id)it.group='';});
  groups.splice(editGrpIdx,1);
  saveData();closeGroupModal();renderGroups();
}

// ── MENU ──
function openMenu(){document.getElementById('menuModal').classList.add('open');}
function closeMenu(){document.getElementById('menuModal').classList.remove('open');}

// ── XLSX 가져오기 ──
let xlsxRaws=[], xlsxHdrs=[];
function startXlsxImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      xlsxRaws=XLSX.utils.sheet_to_json(ws,{header:1});
      if(!xlsxRaws||xlsxRaws.length<2){alert('데이터가 없는 파일이에요');return;}
      // 헤더 공백 제거해서 저장
      xlsxHdrs=(xlsxRaws[0]||[]).map((h,i)=>h?String(h).trim():`열${i+1}`);

      // 앱 내보내기 형식 감지 — 정확한 이름 매칭
      const has=(k)=>xlsxHdrs.some(h=>h.trim()===k);
      const idxOf=(k)=>xlsxHdrs.findIndex(h=>h.trim()===k);
      const isAppExport=has('이름')&&has('타입')&&has('아이디')&&has('비밀번호')&&has('그룹');

      if(isAppExport){
        function getOrCreateGroup(gName){
          if(!gName||!gName.trim())return'';
          const name=gName.trim();
          let g=groups.find(g=>g.name===name);
          if(!g){g={id:'g'+Date.now()+'_'+Math.random().toString(36).slice(2),name,icon:'📁',color:'#2d6a4f'};groups.push(g);}
          return g.id;
        }
        const imp=xlsxRaws.slice(1).filter(r=>r&&r[idxOf('이름')]!=null&&String(r[idxOf('이름')]||'').trim()).map(r=>{
          const v=(k)=>{const i=idxOf(k);return i>=0?String(r[i]||'').trim():'';};
          return{
            type:v('타입')==='은행'?'bank':'pw',
            name:v('이름'),id:v('아이디'),pw:v('비밀번호'),
            acct:v('계좌번호'),acctPw:v('계좌비번'),
            bankId:v('뱅킹ID'),bankPw:v('뱅킹PW'),
            group:getOrCreateGroup(v('그룹')),
            note:v('메모'),updated:Date.now()
          };
        });
        if(!imp.length){alert('가져올 데이터가 없어요');return;}
        const dupes=imp.filter(it=>items.find(d=>d.name===it.name&&d.id===it.id)).length;
        if(!confirm(`${imp.length}개 항목 자동 인식${dupes?` (중복 ${dupes}개 제외)`:''}\n\n가져올까요?`))return;
        imp.forEach(it=>{if(!items.find(d=>d.name===it.name&&d.id===it.id))items.unshift(it);});
        saveData();closeMenu();renderGroups();
        if(document.getElementById('itemScreen').classList.contains('active'))renderItems();
        alert(`✅ ${imp.length-dupes}개 항목을 가져왔어요!`);
        return;
      }

      // 일반 엑셀 → 열 선택 모달 (정확한 이름 우선, 키워드 차선)
      const noneOpt='<option value="-1">— 없음 —</option>';
      const findCol=(exact,kws)=>{
        let i=xlsxHdrs.findIndex(h=>exact.includes(h.trim()));
        if(i<0) i=xlsxHdrs.findIndex(h=>kws.some(w=>h.toLowerCase().includes(w)));
        return i;
      };
      const colMap={
        xSite: findCol(['이름','사이트명','사이트'],['이름','name','site','url']),
        xId:   findCol(['아이디','이메일'],['아이디','id','email','계정']),
        xPw:   findCol(['비밀번호'],['비밀번호','pw','pass','password']),
        xNote: findCol(['메모'],['메모','note','비고']),
      };
      ['xSite','xId','xPw','xNote'].forEach(id=>{
        const sel=document.getElementById(id);
        sel.innerHTML=noneOpt+xlsxHdrs.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
        sel.value=colMap[id]>=0?colMap[id]:-1;
      });
      const grpCol=findCol(['그룹'],['그룹','group','분류','category']);
      document.getElementById('xGrpCol').innerHTML=noneOpt+xlsxHdrs.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
      document.getElementById('xGrpCol').value=grpCol>=0?grpCol:-1;
      fillGroupSelect('xGroup',false);
      closeMenu();
      document.getElementById('xlsxModal').classList.add('open');
    }catch(err){alert('파일을 읽을 수 없어요.');}
  };
  reader.readAsArrayBuffer(file);e.target.value='';
}
function closeXlsx(){document.getElementById('xlsxModal').classList.remove('open');}
function confirmXlsx(){
  const si=parseInt(document.getElementById('xSite').value);
  const ii=parseInt(document.getElementById('xId').value);
  const pi=parseInt(document.getElementById('xPw').value);
  const ni=parseInt(document.getElementById('xNote').value);
  const gi=parseInt(document.getElementById('xGrpCol').value); // 그룹 열
  const defaultGrp=document.getElementById('xGroup').value||'';
  if(si<0){alert('사이트명 열을 선택해 주세요');return;}

  // 엑셀의 그룹명 → 그룹 id 매핑 (없으면 자동 생성)
  function getOrCreateGroup(gName){
    if(!gName) return defaultGrp;
    let g=groups.find(g=>g.name===gName);
    if(!g){
      g={id:'g'+Date.now()+'_'+Math.random().toString(36).slice(2),name:gName,icon:'📁',color:'#2d6a4f'};
      groups.push(g);
    }
    return g.id;
  }

  const imp=xlsxRaws.slice(1).filter(r=>r&&r[si]!=null&&String(r[si]).trim()).map(r=>({
    type:'pw',
    name:String(r[si]||'').trim(),
    id:ii>=0?String(r[ii]||'').trim():'',
    pw:pi>=0?String(r[pi]||'').trim():'',
    note:ni>=0?String(r[ni]||'').trim():'',
    group:gi>=0?getOrCreateGroup(String(r[gi]||'').trim()):defaultGrp,
    updated:Date.now()
  }));
  if(!imp.length){alert('가져올 데이터가 없어요');return;}
  const dupes=imp.filter(it=>items.find(d=>d.name===it.name&&d.id===it.id)).length;
  if(!confirm(`${imp.length}개 항목 가져오기${dupes?` (중복 ${dupes}개 제외)`:''}`))return;
  imp.forEach(it=>{if(!items.find(d=>d.name===it.name&&d.id===it.id))items.unshift(it);});
  saveData();closeXlsx();renderGroups();
  if(document.getElementById('itemScreen').classList.contains('active'))renderItems();
  alert(`✅ ${imp.length-dupes}개 항목을 가져왔어요!`);
}

// ── 메모장 가져오기 ──
function openMemoImport(){
  document.getElementById('memoText').value='';
  fillGroupSelect('mGroup',false);
  document.getElementById('memoModal').classList.add('open');
  setTimeout(()=>document.getElementById('memoText').focus(),120);
}
function closeMemoImport(){document.getElementById('memoModal').classList.remove('open');}
function parseMemo(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
  const res=[];let i=0;
  while(i<lines.length){
    const line=lines[i];
    if(line.includes('/')){
      const parts=line.split('/').map(s=>s.trim());
      const left=parts[0].split(/\s+/);
      res.push({site:left[0]||'',id:left.slice(1).join(' '),pw:parts[1]||''});i++;
    } else {
      const parts=line.split(/\s+/);
      if(parts.length>=3){res.push({site:parts[0],id:parts[1],pw:parts.slice(2).join(' ')});i++;}
      else if(parts.length===1&&i+2<lines.length&&lines[i+1]&&lines[i+2]){res.push({site:line,id:lines[i+1],pw:lines[i+2]});i+=3;}
      else if(parts.length===2){res.push({site:parts[0],id:parts[1],pw:''});i++;}
      else{res.push({site:line,id:'',pw:''});i++;}
    }
  }
  return res;
}
function confirmMemoImport(){
  const raw=document.getElementById('memoText').value.trim();
  if(!raw){alert('내용을 입력해 주세요');return;}
  const grp=document.getElementById('mGroup').value||'';
  const parsed=parseMemo(raw);
  if(!parsed.length){alert('인식된 항목이 없어요');return;}
  const dupes=parsed.filter(p=>items.find(d=>d.name===p.site&&d.id===p.id)).length;
  if(!confirm(`${parsed.length}개 항목 인식됨${dupes?` (중복 ${dupes}개 제외)`:''}\n\n가져올까요?`))return;
  parsed.forEach(p=>{if(!items.find(d=>d.name===p.site&&d.id===p.id))items.unshift({type:'pw',name:p.site,id:p.id,pw:p.pw,group:grp,note:'',updated:Date.now()});});
  saveData();closeMemoImport();renderGroups();
  if(document.getElementById('itemScreen').classList.contains('active'))renderItems();
  alert(`✅ ${parsed.length-dupes}개 항목을 가져왔어요!`);
}

// ── 백업/복원 ──
function exportJSON(){
  const blob=new Blob([JSON.stringify({items,groups},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pwvault_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();closeMenu();
}
function exportCSV(){
  const rows=[['이름','타입','아이디','비밀번호','계좌번호','계좌비번','뱅킹ID','뱅킹PW','그룹','메모'],
    ...items.map(it=>{const g=groups.find(g=>g.id===it.group);return[it.name||'',it.type==='bank'?'은행':'사이트',it.id||'',it.pw||'',it.acct||'',it.acctPw||'',it.bankId||'',it.bankPw||'',g?g.name:'',it.note||''];})];
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pwvault_'+new Date().toISOString().slice(0,10)+'.csv';a.click();closeMenu();
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      const imp=d.items||d;
      const impGrps=d.groups||[];
      if(!Array.isArray(imp))throw new Error();
      if(!confirm(`${imp.length}개 항목을 복원할까요?`))return;
      impGrps.forEach(g=>{if(!groups.find(eg=>eg.id===g.id))groups.push(g);});
      imp.forEach(it=>{if((it.name||it.site)&&!items.find(d=>(d.name||d.site)===(it.name||it.site)&&d.id===it.id))items.push({...it,name:it.name||it.site});});
      saveData();renderGroups();closeMenu();
      if(document.getElementById('itemScreen').classList.contains('active'))renderItems();
      alert(`✅ ${imp.length}개 항목을 복원했어요!`);
    }catch(err){alert('올바른 백업 파일이 아니에요.');}
  };
  reader.readAsText(file);e.target.value='';
}
function clearAll(){if(!confirm('모든 데이터를 삭제할까요?\n되돌릴 수 없어요.'))return;items=[];groups=[];saveData();renderGroups();closeMenu();if(document.getElementById('itemScreen').classList.contains('active'))goBack();}

// ── PIN 변경 ──
function openPinChange(){['curPin','newPin','newPin2'].forEach(id=>document.getElementById(id).value='');document.getElementById('pmErr').textContent='';document.getElementById('pinChangeModal').classList.add('open');}
function closePinChange(){document.getElementById('pinChangeModal').classList.remove('open');}
async function changePinSubmit(){
  const cur=document.getElementById('curPin').value.trim(),nw=document.getElementById('newPin').value.trim(),nw2=document.getElementById('newPin2').value.trim(),err=document.getElementById('pmErr');
  err.textContent='';
  if(!cur||!nw||!nw2){err.textContent='모든 항목을 입력해 주세요';return;}
  if(!/^\d{4}$/.test(nw)){err.textContent='PIN은 숫자 4자리여야 해요';return;}
  if(nw!==nw2){err.textContent='새 PIN이 일치하지 않아요';return;}
  if(await sha256(cur)!==getPin()){err.textContent='현재 PIN이 틀렸어요';return;}
  await savePin(nw);closePinChange();alert('✅ PIN이 변경됐어요!');
}

// ── UTILS ──
function tp(pw,i){const el=document.getElementById('pv'+i),btn=document.getElementById('pb'+i);if(!el||!btn)return;if(btn.textContent==='보기'){el.textContent=pw;btn.textContent='숨기기';btn.classList.add('ok');}else{el.textContent='••••••••';btn.textContent='보기';btn.classList.remove('ok');}}
function tp2(pw,i){const el=document.getElementById('bpv'+i),btn=document.getElementById('bpb'+i);if(!el||!btn)return;if(btn.textContent==='보기'){el.textContent=pw;btn.textContent='숨기기';btn.classList.add('ok');}else{el.textContent='••••••••';btn.textContent='보기';btn.classList.remove('ok');}}
function cp(val,btn){const done=()=>{const o=btn.textContent;btn.textContent='완료!';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1500);};if(navigator.clipboard){navigator.clipboard.writeText(val).then(done).catch(()=>fb(val,done));}else{fb(val,done);}}
function fb(val,cb){const t=document.createElement('textarea');t.value=val;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);cb();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ea(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

['editModal','menuModal','xlsxModal','memoModal','groupModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
});

initPin();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
